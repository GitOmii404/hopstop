    <!-- Subtle warm bark lip highlight -->
    <path d="M 123,0 C 127,70 119,150 125,230 C 130,310 120,390 126,480 C 129,530 123,570 123,600" 
          fill="none" stroke="#8a5a3a" stroke-width="1.2" opacity="0.35"/>
    <!-- Branching clefts -->
    <path d="M 121,110 C 128,135 136,150 138,170" fill="none" stroke="#000000" stroke-width="1.8" opacity="0.65"/>
    <path d="M 122,340 C 114,365 106,380 102,405" fill="none" stroke="#000000" stroke-width="1.6" opacity="0.60"/>
  </g>

