    <path d="M 273,0 C 268,80 277,170 271,260 C 265,340 276,430 270,520 C 267,560 273,590 273,600" 
          fill="none" stroke="#8a5a3a" stroke-width="1.2" opacity="0.35"/>
    <path d="M 269,200 C 278,225 284,245 288,270" fill="none" stroke="#000000" stroke-width="1.8" opacity="0.65"/>
    <path d="M 268,460 C 259,485 252,505 248,525" fill="none" stroke="#000000" stroke-width="1.6" opacity="0.60"/>
  </g>

  <!-- Crevice 3: x ~ 400 -->
  <g>
    <path d="M 400,0 C 405,90 395,190 402,280 C 408,370 397,460 404,540 C 406,570 400,590 400,600" 
          fill="none" stroke="#050302" stroke-width="4.4" stroke-linecap="round" opacity="0.75"/>
    <path d="M 400,0 C 405,90 395,190 402,280 C 408,370 397,460 404,540 C 406,570 400,590 400,600" 
