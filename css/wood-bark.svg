    <path d="M 70,0 C 76,140 66,270 72,410 C 78,500 70,570 70,600"/>
    <path d="M 172,0 C 176,100 166,200 164,280 C 160,320 168,360 174,440 C 178,520 172,570 172,600"/>
    <path d="M 226,0 C 222,120 230,220 232,280 C 236,320 228,360 222,440 C 218,520 224,570 226,600"/>
    <path d="M 326,0 C 322,110 330,220 324,350 C 320,450 328,540 326,600"/>
    <path d="M 464,0 C 468,120 460,250 464,380 C 470,480 464,550 464,600"/>
    <path d="M 526,0 C 522,110 530,230 524,350 C 520,460 528,540 526,600"/>
  </g>

  <!-- 4. Deep Dark Bark Furrows & Fissures (Realistic 3D Bark Crevices) -->
  <!-- Crevice 1: x ~ 120 -->
  <g>
    <!-- Deep fissure shadow trench -->
    <path d="M 120,0 C 124,70 116,150 122,230 C 127,310 117,390 123,480 C 126,530 120,570 120,600" 
