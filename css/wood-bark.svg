    <path d="M 403,380 C 411,405 418,425 422,450" fill="none" stroke="#000000" stroke-width="1.8" opacity="0.65"/>
  </g>

  <!-- Seamless Border Furrow: x = 0 and x = 600 -->
  <g>
    <path d="M 0,0 C 4,90 -3,190 3,290 C 7,380 -2,470 4,550 C 5,580 0,595 0,600" 
          fill="none" stroke="#000000" stroke-width="3.6" opacity="0.80"/>
    <path d="M 600,0 C 604,90 597,190 603,290 C 607,380 598,470 604,550 C 605,580 600,595 600,600" 
          fill="none" stroke="#000000" stroke-width="3.6" opacity="0.80"/>
  </g>

  <!-- 5. Natural Dark Wood Knots & Swirling Annual Rings -->
  <!-- Knot A (Plank 2 at x=195, y=300) -->
  <g transform="translate(195, 300)">
    <ellipse cx="0" cy="0" rx="26" ry="46" fill="none" stroke="#0d0704" stroke-width="1.4" opacity="0.60"/>
    <ellipse cx="0" cy="0" rx="19" ry="34" fill="none" stroke="#170c07" stroke-width="1.8" opacity="0.75"/>
    <ellipse cx="0" cy="0" rx="12" ry="22" fill="none" stroke="#080402" stroke-width="2.2" opacity="0.85"/>
    <!-- Dense dark resinous knot center -->
    <ellipse cx="0" cy="0" rx="7" ry="13" fill="#000000" opacity="0.95"/>
    <ellipse cx="-1" cy="-2" rx="3" ry="7" fill="#050302" opacity="0.95"/>
    <ellipse cx="2" cy="1" rx="4" ry="8" fill="none" stroke="#9e6945" stroke-width="0.8" opacity="0.45"/>
  </g>

  <!-- Knot B (Plank 4 at x=520, y=140) -->
  <g transform="translate(520, 140)">
    <ellipse cx="0" cy="0" rx="16" ry="28" fill="none" stroke="#120905" stroke-width="1.4" opacity="0.65"/>
    <ellipse cx="0" cy="0" rx="9" ry="17" fill="none" stroke="#080402" stroke-width="1.8" opacity="0.80"/>
    <ellipse cx="0" cy="0" rx="5" ry="9" fill="#000000" opacity="0.95"/>
  </g>

  <!-- 6. Real Tree Bark Lenticels & Horizontal Clefts (Dark Walnut / Smoked Oak Bark) -->
  <g fill="#000000" opacity="0.65">
    <path d="M 45,75 Q 58,73 70,76 Q 58,78 45,75 Z"/>
    <path d="M 72,185 Q 86,182 96,186 Q 84,188 72,185 Z"/>
    <path d="M 28,410 Q 42,407 55,411 Q 40,413 28,410 Z"/>
    <path d="M 68,520 Q 82,518 92,522 Q 80,524 68,520 Z"/>

    <path d="M 148,80 Q 162,77 174,81 Q 160,83 148,80 Z"/>
    <path d="M 225,160 Q 238,157 248,161 Q 236,163 225,160 Z"/>
    <path d="M 152,470 Q 168,467 180,472 Q 166,474 152,470 Z"/>
    <path d="M 228,540 Q 242,537 252,541 Q 240,543 228,540 Z"/>

    <path d="M 305,65 Q 320,62 332,66 Q 318,68 305,65 Z"/>
    <path d="M 345,190 Q 360,187 372,191 Q 358,193 345,190 Z"/>
    <path d="M 312,430 Q 328,427 340,432 Q 326,434 312,430 Z"/>
    <path d="M 355,515 Q 370,512 382,516 Q 368,518 355,515 Z"/>

    <path d="M 440,70 Q 458,67 472,71 Q 456,73 440,70 Z"/>
    <path d="M 525,230 Q 542,227 558,232 Q 540,234 525,230 Z"/>
    <path d="M 460,370 Q 478,367 492,372 Q 476,374 460,370 Z"/>
    <path d="M 530,490 Q 548,487 564,492 Q 546,494 530,490 Z"/>
  </g>

  <!-- 7. Subtle amber wood bark highlights -->
  <g fill="#9c633b" opacity="0.25">
    <path d="M 46,76 Q 58,77 70,77 Q 58,79 46,76 Z"/>
    <path d="M 149,81 Q 162,82 174,82 Q 160,84 149,81 Z"/>
    <path d="M 306,66 Q 320,67 332,67 Q 318,69 306,66 Z"/>
    <path d="M 441,71 Q 458,72 472,72 Q 456,74 441,71 Z"/>
    <path d="M 153,471 Q 168,473 180,473 Q 166,475 153,471 Z"/>
    <path d="M 356,516 Q 370,517 382,517 Q 368,519 356,516 Z"/>
  </g>
